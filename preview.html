.hbar-track.split .seg-b { display: block; height: 100%; background: var(--border-strong); border-radius: 0 4px 4px 0; }
.hbar-track.split .seg-a:last-child { border-radius: 0 4px 4px 0; }
.split-legend { display: flex; gap: 16px; margin-bottom: 14px; font-size: 12.5px; color: var(--text-2); }
.split-legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; }
.sw-0 { background: var(--accent); }
.sw-1 { background: var(--border-strong); }

.linechart { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.lc-axis { height: var(--h); display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: var(--text-3); text-align: right; transform: translateY(-.5em); }
.lc-axis span { line-height: 1; }
.lc-plot { position: relative; height: calc(var(--h) + 22px); }
.lc-grid { position: absolute; inset: 0 0 auto; height: var(--h); display: flex; flex-direction: column; justify-content: space-between; }
.lc-grid i { height: 1px; background: var(--border); }
.lc-area { position: absolute; inset: 0 0 auto; height: var(--h); }
.lc-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lc-dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--surface); cursor: default; }
.lc-dot::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; }
.lc-dot:hover { transform: scale(1.3); }
.lc-x { position: absolute; left: 0; right: 0; top: calc(var(--h) + 6px); height: 14px; font-size: 11px; color: var(--text-3); }
.lc-x span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.lc-x span:first-child { transform: none; }
.lc-x span:last-child { transform: translateX(-100%); }

.chart-tip { position: fixed; z-index: 220; max-width: 260px; padding: 7px 10px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 12.5px; font-weight: 500; pointer-events: none; box-shadow: var(--shadow-lg); }

.goal-progress-list { display: flex; flex-direction: column; gap: 4px; }
.goal-progress-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) 44px 80px; align-items: center; gap: 14px; padding: 8px; border-radius: 9px; }
.goal-progress-row:hover { background: var(--surface-2); }
.gp-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gp-val { font-weight: 600; text-align: right; }
@media (max-width: 600px) { .goal-progress-row { grid-template-columns: minmax(0, 1fr) 44px; } .gp-bar { grid-column: 1 / -1; grid-row: 2; } .gp-sub { display: none; } }

.report-list { padding-left: 18px; display: flex; flex-direction: column; gap: 8px; color: var(--text-2); }
.report-list strong { color: var(--text); }

.table-card { margin-top: 16px; }
.table-card summary { display: flex; align-items: center; gap: 8px; padding: 14px 18px; cursor: pointer; font-weight: 550; color: var(--text-2); list-style: none; }
.table-card summary::-webkit-details-marker { display: none; }
.table-card[open] summary { border-bottom: 1px solid var(--border); }
.table-wrap { max-height: 360px; overflow: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th, .data-table td { padding: 8px 18px; text-align: left; border-bottom: 1px solid var(--border); }
.data-table th { position: sticky; top: 0; background: var(--surface); font-size: 12px; font-weight: 600; color: var(--text-3); }

/* ───────────── Settings ───────────── */
.settings-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px; align-items: start; }

.settings-nav a:hover { background: var(--surface-2); color: var(--text); }
.settings-nav a.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border); }
.settings-body { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.settings-section { padding: 20px 22px; display: flex; flex-direction: column; gap: 4px; scroll-margin-top: calc(var(--topbar-h) + 16px); }
.settings-title { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 15px; font-weight: 600; }
.settings-title .icon { color: var(--text-3); }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 12px 0; border-top: 1px solid var(--border); }
.settings-title + .setting-row { border-top: 0; }
.setting-text { min-width: 0; }
.setting-label { font-weight: 550; }
.setting-help { font-size: 12.5px; color: var(--text-2); max-width: 520px; }
.setting-control { flex: none; }
.setting-control .input-sm[type=time] { width: 132px; }
.status-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 4px 0 8px; }
.status-item { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); min-width: 0; }
.status-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-chip.is-ok { color: var(--success); }
.status-chip.is-off { color: var(--text-2); }
.status-chip.is-off .icon { color: var(--text-3); }
.steps { margin: 8px 0; padding: 14px 16px; border-radius: 12px; border: 1px dashed var(--border-strong); }
.steps ol { margin: 8px 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--text-2); font-size: 13.5px; }
.shortcuts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; margin: 4px 0 10px; }

@media (max-width: 900px) {

  .settings-nav { position: static; flex-direction: row; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .settings-nav a { flex: none; }
  .status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .setting-row { flex-direction: column; align-items: flex-start; }

}

/* ───────────── Sign-in ───────────── */
.auth-wrap { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.auth-card { width: 100%; max-width: 400px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); }

/* ── css/decor.css ── */
/* ═══════════════════════════════════════════════════════════════════════════
   Өнгөлөг — чимэглэлийн давхарга (хамгийн сүүлд ачаална).

   хавтгай блокууд; налуу таб, дугуй өнгөт дүрс, эргүүлэг хээ.

   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Дэвсгэр: бүдэг өнгөт толбо ─────────────────────────────────────────── */
body {
  background-color: var(--bg);

    radial-gradient(440px 440px at 6% 10%, var(--bokeh-1), transparent 70%),
    radial-gradient(380px 380px at 94% 6%, var(--bokeh-2), transparent 70%),
    radial-gradient(520px 520px at 88% 94%, var(--bokeh-3), transparent 70%),
    radial-gradient(320px 320px at 32% 88%, var(--bokeh-2), transparent 70%);
  background-attachment: fixed;
}

/* ── Үсэг ──────────────────────────────────────────────────────────────── */
.page-title {

  text-transform: uppercase; letter-spacing: .01em; text-wrap: balance;

  transform: skewX(-24deg); transform-origin: left;
}
.eyebrow { color: var(--accent); font-weight: 800; letter-spacing: .12em; }
.section-title { font-family: var(--font-display); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.section-title::before { content: ''; flex: none; width: 14px; height: 6px; background: var(--pink); transform: skewX(-24deg); }

/* ── Хажуугийн цэс: өнгөт дугуй дүрс + налуу идэвхтэй таб ────────────────── */
.sidebar { background: var(--surface); }
.brand-mark { border-radius: 50%; background: conic-gradient(var(--pink) 0 25%, var(--yellow) 0 50%, var(--teal) 0 75%, var(--blue) 0); }
.brand-mark::after { border-color: var(--surface); }

.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 22px; text-transform: uppercase; letter-spacing: .06em; }
.nav-section { font-family: var(--font-display); font-weight: 500; letter-spacing: .12em; }

.nav-item { --c: var(--slate); gap: 10px; font-weight: 600; }
.nav-item[data-nav="dashboard"] { --c: var(--pink); }
.nav-item[data-nav="calendar"] { --c: var(--teal); }
.nav-item[data-nav="tasks"] { --c: var(--yellow); }
.nav-item[data-nav="goals"] { --c: var(--blue); }
.nav-item[data-nav="assistant"] { --c: var(--violet); }
.nav-item[data-nav="journal"] { --c: var(--teal); }
.nav-item[data-nav="birthdays"] { --c: var(--orange); }
.nav-item[data-nav="notifications"] { --c: var(--pink); }
.nav-item[data-nav="analytics"] { --c: var(--blue); }
.nav-item .icon {
  box-sizing: border-box; flex: none; width: 28px; height: 28px; padding: 5px; border-radius: 50%;
  background: color-mix(in srgb, var(--c) 15%, transparent);
  color: color-mix(in srgb, var(--c) 80%, var(--text));

}
.nav-item:hover .icon { background: color-mix(in srgb, var(--c) 28%, transparent); transform: rotate(-8deg); }
.nav-item[aria-current="page"] {

}

/* ── Товч, талбар ───────────────────────────────────────────────────────── */
.btn { border-radius: 10px; font-weight: 700; }
.btn-primary { box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000); }

/* ── Карт ──────────────────────────────────────────────────────────────── */

.card:nth-of-type(4n+2) { --cc: var(--teal); }
.card:nth-of-type(4n+3) { --cc: var(--yellow); --cc-ink: var(--on-yellow); }
.card:nth-of-type(4n+4) { --cc: var(--blue); }
.card-link { /* «Read more» маягийн жижиг ягаан товч */

}
.card-link:hover { background: var(--accent-hover); color: var(--accent-contrast); }

/* ── Ажлын мөр ───────────────────────────────────────────────────────────── */
.task.is-done .task-check { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.task-check:hover { border-color: var(--accent); color: var(--accent); }
.meta-item.tag { border-radius: 4px; font-weight: 700; background: color-mix(in srgb, var(--violet) 13%, transparent); color: var(--violet); }
.task.is-new { animation: color-flash 1.8s var(--ease); border-radius: 10px; }
@keyframes color-flash {
  0% { background: color-mix(in srgb, var(--yellow) 55%, transparent); transform: translateX(6px); }
  50% { background: color-mix(in srgb, var(--yellow) 30%, transparent); transform: none; }
  100% { background: transparent; }
}

/* ── Хянах самбар: ногоон цэнхэр hero ────────────────────────────────────── */
.hero {
  position: relative; isolation: isolate; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 28px;
  margin: 18px 0 22px; padding: 32px 38px 28px;
  border-radius: var(--radius-xl); color: var(--hero-ink);
  background: linear-gradient(105deg, var(--hero-from) 0%, var(--hero-to) 100%);
  box-shadow: var(--shadow);
}

  background: repeating-radial-gradient(circle, rgba(255, 255, 255, .13) 0 2px, transparent 2px 12px);
}
.hero::before { width: 240px; height: 240px; left: -80px; bottom: -110px; }
.hero::after { width: 320px; height: 320px; right: -60px; top: -120px; background: repeating-radial-gradient(circle, rgba(255, 255, 255, .1) 0 2px, transparent 2px 14px); }
.hero-text { min-width: 0; }
.hero .eyebrow {
  display: inline-block; padding: 5px 12px; border-radius: 4px;
  background: var(--yellow); color: var(--on-yellow); letter-spacing: .1em;
  transform: skewX(-10deg);
}
.hero-title { margin-top: 14px; font-size: 58px; font-weight: 300; line-height: .98; color: var(--hero-ink); }
.hero-title strong { font-weight: 700; }
.hero-title::after { display: none; }
.hero-sub { margin-top: 10px; font-size: 16px; font-weight: 600; color: rgba(255, 255, 255, .94); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn-glass { background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .45); color: #fff; }
.btn-glass:hover { background: #fff; color: var(--tile-teal); border-color: #fff; }

/* Том бичих талбар */
.composer {
  position: relative; display: flex; align-items: center; gap: 10px;
  max-width: 740px; margin-top: 22px; padding: 7px 7px 7px 18px;
  background: var(--surface); border-radius: 14px;
  box-shadow: 0 6px 0 rgba(0, 0, 0, .14);
  transition: box-shadow var(--dur), transform var(--dur);
}
.composer:focus-within { transform: translateY(-2px); box-shadow: 0 0 0 4px var(--yellow), 0 8px 0 rgba(0, 0, 0, .14); }
.composer-icon { flex: none; display: grid; place-items: center; color: var(--pink); }
.composer-input {
  flex: 1; min-width: 0; height: 52px; border: 0; outline: 0; background: transparent;
  font: inherit; font-size: 18px; font-weight: 700; color: var(--text);
}
.composer-input::placeholder { color: var(--text-3); font-weight: 600; }
.composer-send {
  flex: none; width: 50px; height: 50px; border-radius: 10px; display: grid; place-items: center;
  background: var(--tile-pink); color: #fff; box-shadow: 0 4px 0 #9E1C50;
  transition: transform .1s, box-shadow .1s, background var(--dur);
}
.composer-send:hover { background: #E8397D; }
.composer-send:active { transform: translateY(3px); box-shadow: 0 1px 0 #9E1C50; }
.composer.is-shake { animation: color-shake .35s; }
@keyframes color-shake { 25% { translate: -6px 0; } 50% { translate: 5px 0; } 75% { translate: -3px 0; } }

.composer-preview { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 30px; max-width: 740px; margin-top: 14px; font-size: 12.5px; }
.cp-hint { font-weight: 800; color: rgba(255, 255, 255, .88); }
.cp-example {
  padding: 4px 10px; border-radius: 6px; white-space: nowrap; font-size: 12.5px; font-weight: 600; color: #fff;
  background: rgba(255, 255, 255, .12); border: 1px dashed rgba(255, 255, 255, .6);
  transition: background var(--dur), color var(--dur);
}
.cp-example:hover { background: #fff; color: var(--tile-teal); border-style: solid; }
.cp-kind { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 6px; font-weight: 800; background: var(--yellow); color: var(--on-yellow); }
.cp-kind.is-event { background: var(--tile-pink); color: #fff; }
.cp-title { margin-right: 2px; font-weight: 800; color: #fff; overflow-wrap: anywhere; }
.composer-preview .parse-chip { height: 24px; border-color: transparent; background: rgba(255, 255, 255, .95); color: #1D2433; }
.cp-done { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 11px; border-radius: 6px; font-weight: 800; background: #fff; color: var(--tile-teal); animation: color-pop .35s var(--ease); }
.cp-when { margin-right: 6px; font-weight: 800; color: #fff; }
@keyframes color-pop { from { transform: scale(.85); opacity: 0; } }

/* Ягаан дугуй стикер — өнөөдрийн ахиц */
.hero-ring {
  position: relative; width: 156px; height: 156px; display: grid; place-items: center;
  border-radius: 50%; background: var(--tile-pink); color: #fff;
  box-shadow: 0 8px 0 -2px rgba(0, 0, 0, .12), 0 20px 34px -14px rgba(0, 0, 0, .45);

}

.kpis .kpi:nth-child(2) { --t: var(--tile-teal); --on: #fff; }
.kpis .kpi:nth-child(3) { --t: var(--tile-yellow); --on: var(--on-yellow); }

.kpis .kpi::after {

}
.kpis .kpi-label { color: inherit; font-size: 11.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
.kpis .kpi-label .icon { box-sizing: border-box; width: 30px; height: 30px; padding: 6px; border-radius: 50%; background: #fff; color: var(--t); }
.kpis .kpi:nth-child(3) .kpi-label .icon { color: #B07800; }
.kpis .kpi-value, .kpis .kpi.is-alert .kpi-value { font-family: var(--font-display); font-size: 40px; font-weight: 600; color: inherit; font-variant-numeric: lining-nums; }
.kpis .kpi-value small { color: inherit; opacity: .75; }
.kpis .kpi-sub { color: inherit; opacity: .88; font-weight: 600; }
.kpis .progress { background: color-mix(in srgb, var(--on) 25%, transparent); }
.kpis .progress > span { background: var(--on); }

/* ── Календарь, бусад ───────────────────────────────────────────────────── */
.cal-cell:not(.is-other):hover { background: color-mix(in srgb, var(--teal) 8%, transparent); }
.toast { border-radius: 10px; }

/* ── Таблет (дүрсэн цэс) ─────────────────────────────────────────────────── */
@media (max-width: 1180px) and (min-width: 761px) {
  .nav-item[aria-current="page"] { clip-path: none; border-radius: 12px; padding-right: 10px; }
}

/* ── Утас ──────────────────────────────────────────────────────────────── */
@media (max-width: 760px) {
  .page-title { font-size: 30px; }
  .bn-item[aria-current="page"], .bn-item.is-active { color: var(--accent); font-weight: 800; }

    content: ''; position: absolute; top: 0; left: 50%; width: 36px; height: 4px; margin-left: -18px;
    border-radius: 0 0 4px 4px; background: var(--accent);
  }

  .hero { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; margin: 10px 0 16px; padding: 22px 18px 18px; }
  .hero-text { display: contents; }
  .hero-text > * { grid-column: 1 / -1; }
  .hero-text > .eyebrow, .hero-text > .hero-title, .hero-text > .hero-sub { grid-column: 1; justify-self: start; }
  .hero-ring { grid-column: 2; grid-row: 1 / span 3; align-self: start; width: 96px; height: 96px; }
  .hero-ring svg { inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }
  .ring-num { font-size: 26px; }
  .ring-num small { font-size: 13px; }
  .ring-label { font-size: 9.5px; }
  .hero-title { margin-top: 8px; font-size: 34px; overflow-wrap: break-word; }
  .hero-ring { width: 88px; height: 88px; }
  .hero-sub { font-size: 14.5px; }
  .composer { margin-top: 14px; padding-left: 14px; }
  .composer-input { height: 46px; font-size: 16px; }
  .composer-send { width: 44px; height: 44px; }
  .composer-preview:has(.cp-example) { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -18px; padding-right: 18px; }
  .composer-preview:has(.cp-example)::-webkit-scrollbar { display: none; }
  .kpis .kpi-value, .kpis .kpi.is-alert .kpi-value { font-size: 32px; }
}

@media (prefers-reduced-motion: reduce) {
  .composer.is-shake, .task.is-new, .cp-done { animation: none; }
  .task.is-new { background: color-mix(in srgb, var(--yellow) 25%, transparent); }
  .kpis .kpi:hover, .hero-ring, .hero-ring:hover { transform: none; }
}

 * In-memory application state.
 *
 * Services load rows from the database into this store, and every page
 * renders from it. When a service changes data it updates the store, the
 * store notifies subscribers, and the router re-renders the current page.
 *
 * This is a cache of the database, not a replacement for it: nothing here is
 * persisted. In session mode (no Supabase configured) it is the only copy,
 * which is why everything is cleared on reload.

  events: [],
  goals: [],
  projects: [],
  journal: [],
  birthdays: [],
  conversations: [],
  messages: [],
  memories: [],

  mode: 'session',   // 'session' | 'supabase'
  user: null,        // Supabase auth user when signed in

const { todayKey, addDaysKey, relDay, fmt, fmtTime, fmtDuration, minToTime, timeToMin, nowMinutes } = __req("js/lib/dates.js");

// Кирилл үгэнд \b ажилладаггүй тул энгийн "агуулж байна уу" шалгалт хийнэ.
const has = (text, re) => re.test(text);
const EVENT_WORDS = /\b(meeting|meet with|appointment|call with|lunch|dinner|breakfast|brunch|coffee with|interview|class|lecture|seminar|event|party|conference|webinar|workshop|doctor|dentist|concert|flight)\b|уулзалт|уулзах|хурал|үдийн хоол|оройн хоол|өглөөний цай|кофе|ярилцлага|хичээл|лекц|семинар|сургалт|эмч|тоглолт|үдэшлэг|арга хэмжээ|нислэг|вебинар/i;

const reply = (content, actions = []) => ({ content, actions, source: 'local-rules' });
const proposal = (type, data) => ({ type, data, status: 'pending' });

/** "Өнөөдөр, 11-р сарын 1" эсвэл "11-р сарын 6, Баасан" */
function dayLabel(key) {
  const rel = relDay(key);
  return ['Өнөөдөр', 'Маргааш', 'Нөгөөдөр'].includes(rel) ? `${rel}, ${fmt.short(key)}` : fmt.long(key);
}

function respond(text) {
  const t = String(text || '').trim();
  const low = t.toLowerCase();
  if (!t) return fallback();

  // Тодорхой командууд түлхүүр үгээс түрүүлж шийдэгдэнэ ("Ажил: тайлан илгээх" бол ажил).
  if (/^(please\s+)?((add|create|new|make)\s+(a\s+|an\s+)?(new\s+)?(task|todo|to-do|reminder)\b|remind me\b|(task|todo|to-do)\s*:)/.test(low)
    || /^(шинэ\s+)?(ажил|даалгавар|сануулга)\s*(нэм(эх|ээрэй)?)?\s*[:\-–]|^сануул/.test(low)
    || /(ажил|даалгавар)\s+нэм(ээрэй|ээч|эх)?\s*[.!]?$|сануулаарай\s*[.!]?$/.test(low)) {
    return taskProposal(t, /deadline|эцсийн хугацаа|дедлайн/.test(low));
  }
  if (/^(please\s+)?((add|create|new|schedule|book)\s+(an?\s+)?(new\s+)?(event|meeting|appointment)\b|event\s*:)/.test(low)
    || /^(шинэ\s+)?(арга хэмжээ|үйл явдал)\s*(нэм(эх|ээрэй)?)?\s*[:\-–]|(календарь|хуанли)(т|д|нд)?\s*(нэм|оруул)/.test(low)) {
    return eventProposal(t);
  }

  if (/^(hi|hello|hey|yo|good (morning|afternoon|evening))\b[!. ]*$/i.test(t) || /^(сайн уу|сайн байна уу|сайн байцгаана уу|сайхан амарсан уу)[!.?\s]*$/i.test(t)) return help(true);
  if (/\b(help|what can you do|commands)\b/.test(low) || has(low, /тусламж|юу хийж чадах|команд/)) return help(false);
  if (/\b(break(?:ing)?\s+(?:it\s+|this\s+)?down|break\b.+\binto\b|split\b.+\binto\b|sub-?tasks?|steps\s+(?:for|to))\b/.test(low) || has(low, /задла|дэд ажил|алхам болго|хэсэгчил/)) return breakdown(t);
  if (/^(please\s+)?remember\b/.test(low) || /^(санаарай|санаж ав|тэмдэглэж ав)|гэдгийг санаарай\s*[.!]?$/.test(low)) return memory(t);
  if (/\b(unfinished|overdue|incomplete|pending|what'?s left|left to do|review (?:my )?tasks|open tasks|not done|backlog)\b/.test(low) || has(low, /дуусаагүй|хоцорсон|хугацаа хэтэрсэн|үлдсэн ажил|хийгээгүй|хийгдээгүй/)) return review();
  if (/\b(insights?|productiv\w*|stats|statistics|how am i doing|how did i do|my progress|(weekly|progress|productivity) report)\b/.test(low) || has(low, /статистик|бүтээмж|үзүүлэлт|ахиц|яаж байна/)) return insights();
  if (/\b(plan|schedule|organi[sz]e|map out)\b.*\bweek\b|\bweekly\s+(plan|schedule)\b/.test(low) || has(low, /долоо хоног.*(төлөвлө|хуваарь|хуваарила)|(төлөвлө|хуваарь).*долоо хоног/)) return weekPlan();
  if (!EVENT_WORDS.test(low) && (/\b(plan|schedule|organi[sz]e|map out)\b.*\b(day|today|tomorrow)\b|\bdaily\s+(plan|schedule)\b|\bwhat should i (do|work on)\b/.test(low)
    || has(low, /(өдр(өө|ийг|ийн)|өнөөдр(өө|ийг)|маргааш(ийг|ийн)?).*(төлөвлө|хуваарь)|(төлөвлө|хуваарь).*(өдөр|өдр|маргааш)|юу хийх вэ|юу хийвэл/))) {
    return dayPlan(/\btomorrow\b|маргааш/.test(low) ? addDaysKey(todayKey(), 1) : todayKey());
  }
  if ((/^(what|when|which|show|list|do i have|anything)\b/.test(low) && /\b(today|tomorrow|agenda|calendar|events?|meetings?|schedule|on)\b/.test(low))
    || has(low, /(юу|ямар).*(байгаа|байна|төлөвлөсөн|товлосон)|календарь(т|д)? юу|хуваарь(т)? юу/)) return agenda(t);
  if (EVENT_WORDS.test(low)) return eventProposal(t);
  const parsed = parseNatural(t);
  if (/\b(add|create|new|remind me|todo|to-do|task|need to|have to|must|deadline|due)\b/.test(low) || has(low, /нэм|хэрэгтэй|ёстой|эцсийн хугацаа/) || parsed.date || parsed.time) {
    return taskProposal(t, /deadline|эцсийн хугацаа|дедлайн/.test(low));
  }
  return fallback();
}

/* ---------- командууд ---------- */

function taskProposal(text, isDeadline) {
  const p = parseNatural(text);
  const title = cleanTaskTitle(p.rest);
  if (!title) return reply('Ажил нэмж болно, гэхдээ ажлын нэрийг олсонгүй. Жишээ нь: “Ажил: Баасан гарагт паспорт сунгах”.');
  const data = {
    title,
    due_date: p.date,
    due_time: p.time,
    priority: p.priority || (isDeadline ? 'high' : prefs.get().defaultPriority),
    category: p.category || '',
    estimated_minutes: p.minutes || Number(prefs.get().defaultDuration) || DEFAULT_ESTIMATE,
  };
  const notes = [];
  if (!p.date) notes.push('огноо дурдаагүй тул эцсийн хугацаагүй');
  if (!p.minutes) notes.push(`хугацааг ${fmtDuration(data.estimated_minutes)} гэж тооцсон`);
  return reply(`Таны мессежээс ингэж ойлголоо. Мэдээллээ шалгаад нэмээрэй${notes.length ? ` (${notes.join('; ')})` : ''}.`, [proposal('create_task', data)]);
}

function guessCategory(text) {
  if (/doctor|dentist|gym|yoga|run|therapy|clinic|эмч|фитнесс|йог|гүйлт|эмнэлэг|спорт/i.test(text)) return 'health';
  if (/lunch|dinner|coffee|party|drinks|brunch|friend|concert|үдийн хоол|оройн хоол|кофе|үдэшлэг|найз|тоглолт/i.test(text)) return 'social';
  if (/meeting|call|interview|client|stand-?up|review|workshop|conference|webinar|seminar|уулзалт|хурал|ярилцлага|үйлчлүүлэгч|семинар|сургалт|вебинар/i.test(text)) return 'work';
  return 'personal';
}

function eventProposal(text) {
  const p = parseNatural(text);
  const title = cleanEventTitle(p.rest);
  if (!title) return reply('Үйл явдал нэмж болно, гэхдээ нэрийг нь олсонгүй. Жишээ нь: “Маргааш 12:30-13:30 Маятай үдийн хоол”.');
  const date = p.date || todayKey();
  let start = p.time;
  if (!start) start = date === todayKey() ? minToTime(Math.min(Math.ceil((nowMinutes() + 1) / 60) * 60, 23 * 60)) : '09:00';
  const end = p.endTime || minToTime(Math.min(timeToMin(start) + (p.minutes || 60), 24 * 60 - 1));
  const assumed = [];
  if (!p.date) assumed.push('өнөөдөр');
  if (!p.time) assumed.push(`${fmtTime(start)}-д эхэлнэ`);
  if (!p.minutes && !p.endTime) assumed.push('1 цаг үргэлжилнэ');
  const data = { title, event_date: date, start_time: start, end_time: end, all_day: false, category: guessCategory(text), location: '' };
  return reply(`Үйл явдлыг ингэж ойлголоо${assumed.length ? ` — ${assumed.join(', ')} гэж тооцсон` : ''}. Нэмэхээсээ өмнө засаж болно.`, [proposal('create_event', data)]);
}

function memory(text) {
  const content = text
    .replace(/^(please\s+)?remember\s+(that\s+)?/i, '')
    .replace(/^(санаарай|санаж ав(аарай)?|тэмдэглэж ав(аарай)?)\s*[:\-–,]?\s*/i, '')
    .replace(/\s*гэдгийг\s+санаарай\s*[.!]?$/i, '')
    .trim();
  if (!content) return reply('Юуг санах вэ? Жишээ нь: “Санаарай: Би өглөө хамгийн сайн төвлөрдөг.”');
  return reply('Үүнийг санамжид хадгалах уу? Санамжууд таны өгөгдөлтэй хамт хадгалагдаж, AI загвар холбогдсоны дараа хүсэлт бүртэй хамт илгээгдэнэ.', [
    proposal('create_memory', { content: content.charAt(0).toUpperCase() + content.slice(1) }),
  ]);
}

function review() {
  const open = tasksService.open();
  if (!open.length) return reply('Дуусаагүй ажил алга — бүгдийг нь дуусгасан байна.');
  const today = todayKey();
  const overdue = open.filter((t) => t.due_date && t.due_date < today).length;
  const dueToday = open.filter((t) => t.due_date === today).length;
  const noDate = open.filter((t) => !t.due_date).length;
  const later = open.length - overdue - dueToday - noDate;
  const ids = [...open].sort(compareTasks).slice(0, 12).map((t) => t.id);
  const lines = [
    `Танд ${open.length} дуусаагүй ажил байна:`,
    `• ${overdue} хугацаа хэтэрсэн`, `• ${dueToday} өнөөдөр дуусах`, `• ${later} дараа дуусах`, `• ${noDate} огноогүй`,
  ];
  if (overdue) lines.push('', 'Хугацаа хэтэрснээс эхлээрэй — доор дуусгах эсвэл өнөөдөр рүү шилжүүлж болно.');
  return reply(lines.join('\n'), [proposal('review', { task_ids: ids })]);
}

function insights() {
  if (!tasksService.all().length) return reply('Ажлын түүх алга тул шинжлэх зүйл байхгүй байна. Хэдэн ажил дуусгаад дахин асуугаарай.');
  const s = computeStats(7);
  const prev = computeStats(7, addDaysKey(todayKey(), -7));
  const diff = s.completedCount - prev.completedCount;
  const lines = [`• Сүүлийн 7 хоногт ${s.completedCount} ажил дуусгасан (өмнөх 7 хоногоос ${diff >= 0 ? '+' : ''}${diff}).`];
  if (s.completionRate !== null) lines.push(`• Энэ хугацаанд дуусах ёстой ажлын ${Math.round(s.completionRate * 100)}% нь дууссан.`);
  if (s.onTimeRate !== null) lines.push(`• Эцсийн хугацаатай дууссан ажлын ${Math.round(s.onTimeRate * 100)}% нь хугацаандаа дууссан.`);
  if (s.bestWeekday) lines.push(`• Хамгийн бүтээмжтэй өдөр: ${s.bestWeekday}.`);
  if (s.byCategory[0]?.minutes) lines.push(`• Хамгийн их цаг “${s.byCategory[0].name}” ангилалд зарцуулагдсан (${fmtDuration(s.byCategory[0].minutes)}).`);
  if (s.overdueNow) lines.push(`• Яг одоо ${s.overdueNow} ажлын хугацаа хэтэрсэн байна.`);
  if (s.avgMood !== null) lines.push(`• Дундаж сэтгэл санаа: 5-аас ${s.avgMood.toFixed(1)} (${s.moods.length} тэмдэглэлээр).`);
  if (s.moodGoodAvg !== null && s.moodLowAvg !== null) {
    lines.push(`• Сэтгэл сайхан өдрүүдэд дунджаар ${s.moodGoodAvg.toFixed(1)} ажил, муу өдрүүдэд ${s.moodLowAvg.toFixed(1)} ажил дуусгасан.`);
  }
  return reply(`Эдгээр тоо таны өгөгдлөөс шууд тооцоологдсон:\n${lines.join('\n')}`, [{
    type: 'insights',
    status: 'info',
    data: { completed: s.completedCount, prevCompleted: prev.completedCount, completionRate: s.completionRate, onTimeRate: s.onTimeRate, focusMinutes: s.focusMinutes, overdue: s.overdueNow },
  }]);
}

function dayPlan(dateKey) {
  let plan = planDay(dateKey);
  let note = '';
  if (plan.dayOver) {
    note = `Өнөөдрийн ажлын цаг (${fmtTime(plan.workStart)}–${fmtTime(plan.workEnd)}) дууссан тул маргаашийн төлөвлөгөө гаргалаа.\n\n`;
    plan = planDay(addDaysKey(dateKey, 1));
  }
  const taskBlocks = plan.blocks.filter((b) => b.kind === 'task');
  if (!taskBlocks.length && !plan.unscheduled.length) {
    return reply(`${note}Хуваарьт оруулах дуусаагүй ажил алга (${dayLabel(plan.date)}). Эцсийн хугацаатай эсвэл огноогүй ажил нэмээд дахин асуугаарай.`, [
      { type: 'link', status: 'info', data: { label: 'Календарь нээх', href: `#/calendar?view=day&date=${plan.date}` } },
    ]);
  }
  const minutes = taskBlocks.reduce((sum, b) => sum + (timeToMin(b.end) - timeToMin(b.start)), 0);
  const lines = [`${note}Хуваарийн ноорог — ${dayLabel(plan.date)}. Ажлын цаг (${fmtTime(plan.workStart)}–${fmtTime(plan.workEnd)}), үйл явдлууд, ач холбогдлоор эрэмбэлсэн ажлууд дээр үндэслэв:`];
  lines.push(`• ${taskBlocks.length} ажил хуваарьт орсон — нийт ${fmtDuration(minutes)} төвлөрсөн ажил`);
  if (plan.unscheduled.length) lines.push(`• Эцсийн хугацаатай ${plan.unscheduled.length} ажил багтсангүй — шилжүүлэх хэрэгтэй байж магадгүй`);
  if (taskBlocks.some((b) => !b.estimated)) lines.push(`• Хугацаа тооцоогүй ажлуудад ${DEFAULT_ESTIMATE} минут өгсөн`);
  return reply(lines.join('\n'), [proposal('schedule_day', plan)]);
}

function weekPlan() {
  const plan = planWeek(todayKey());
  const total = plan.days.reduce((s, d) => s + d.tasks.length, 0);
  if (!total && !plan.unscheduled.length) return reply('Ирэх 7 хоногт төлөвлөх дуусаагүй ажил алга. Хэдэн ажил нэмээд дахин асуугаарай.');
  const over = plan.days.filter((d) => d.planned > d.capacity);
  const lines = [`Ирэх 7 хоногийн (${fmt.short(plan.from)} – ${fmt.short(plan.to)}) ажлын хуваарилалт. Ажлууд эцсийн хугацаагаа хадгална; огноогүй ажлуудыг хамгийн их чөлөөт цагтай өдрүүдэд санал болгов.`];
  if (plan.suggestions.length) lines.push(`• ${plan.suggestions.length} огноогүй ажилд өдөр санал болгосон`);
  if (over.length) lines.push(`• Ачаалал хэтэрсэн: ${over.map((d) => fmt.medium(d.date)).join(', ')}`);
  if (plan.unscheduled.length) lines.push(`• ${plan.unscheduled.length} ажил энэ долоо хоногт багтсангүй`);
  return reply(lines.join('\n'), [proposal('schedule_week', plan)]);
}

function agenda(text) {
  const key = parseNatural(text).date || todayKey();
  const events = eventsService.on(key);
  const tasks = tasksService.dueOn(key).filter((t) => t.status !== 'done');
  const birthdays = birthdaysService.onDate(key);
  const link = { type: 'link', status: 'info', data: { label: 'Календарьт нээх', href: `#/calendar?view=day&date=${key}` } };
  if (!events.length && !tasks.length && !birthdays.length) return reply(`${dayLabel(key)} — төлөвлөсөн зүйл алга.`, [link]);
  const lines = [`${dayLabel(key)}:`];
  events.forEach((e) => lines.push(`• ${e.all_day || !e.start_time ? 'Өдөржин' : fmtTime(e.start_time)} — ${e.title}`));
  birthdays.forEach((b) => lines.push(`• Төрсөн өдөр: ${b.name}`));
  tasks.forEach((t) => lines.push(`• Ажил: ${t.title}${t.due_time ? ` (${fmtTime(t.due_time)} гэхэд)` : ''}`));
  return reply(lines.join('\n'), [link]);
}

function breakdown(text) {
  const name = text
    .replace(/^(please\s+)?(can you\s+|could you\s+|help me\s+)?/i, '')
    .replace(/\b(break(ing)?\s+(it\s+|this\s+)?down|break|split|into\s+(sub-?tasks?|steps|tasks|smaller\s+\w+)|sub-?tasks?\s+(for|of)|steps\s+(for|to)|the\s+project|project)\b\s*:?/gi, ' ')
    .replace(/(төсл(ийг|өө|ийн)?|төсөл|задла(х|аарай|ж өгөөч|ж өг)?|дэд\s+ажл?(ууд)?(д|аар|ыг)?|алхам(ууд)?\s+болго(ж)?(\s+өг(өөч)?)?|хэсэгчил(ж)?(\s+өг(өөч)?)?)\s*:?/gi, ' ')
    .replace(/[“”"'«»]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/^(the|my|a)\s+/i, '')
    .replace(/[\s:,.]+$/, '')
    .trim();
  if (!name) return reply('Аль төслийг задлах вэ? Жишээ нь: “Төслийг задла: Портфолио вэбсайт гаргах”.');
  const lower = name.toLowerCase();
  const project = projectsService.all().find((p) => p.title.toLowerCase() === lower)
    || projectsService.all().find((p) => p.title.toLowerCase().includes(lower) || lower.includes(p.title.toLowerCase()));
  const steps = [
    'Үр дүн болон “дууссан” гэдгийг тодорхойлох',
    'Шаардлагатай зүйлсийг жагсаах — мэдээлэл, хүн, хэрэгсэл',
    'Эхний бодит ажлыг хийх',
    'Үр дүнг хянаж, дутууг засах',
    'Дуусгаж хүлээлгэн өгөх',
  ];
  const title = project ? project.title : name.charAt(0).toUpperCase() + name.slice(1);
  return reply(`“${title}” төслийг яг тохирсон дэд ажлууд болгон задлахад AI загвар хэрэгтэй, одоогоор холбогдоогүй байна. Оронд нь ерөнхий жагсаалт бэлдлээ — алхмуудыг засаж, нэмж, хасаад ажил болгон үүсгээрэй.`, [
    proposal('breakdown', { title, project_id: project?.id || null, steps }),
  ]);
}

function help(greet) {
  return reply(`${greet ? 'Сайн байна уу! ' : ''}AI загвар холбогдоогүй тул зөвхөн дараах командуудыг (энгийн дүрэм + таны өгөгдөл) ойлгоно:
• Ажил нэмэх — “Баасан гарагт 15 цагт тайлан илгээх чухал #ажил 1 цаг”
• Үйл явдал нэмэх — “Маргааш 12:30-13:30 Маятай үдийн хоол”
• Өдрөө төлөвлөх — “Өдрөө төлөвлө” эсвэл “Маргаашийг төлөвлө”
• Долоо хоногоо төлөвлөх — “Долоо хоногоо төлөвлө”
• Дуусаагүй ажлууд — “Дуусаагүй ажлууд юу байна?”
• Бүтээмжийн статистик — “Статистикаа харуул”
• Хуваарь — “Маргааш юу байгаа вэ?”
• Төслийг задлах — “Төслийг задла: Вэбсайт гаргах”
• Санамж хадгалах — “Санаарай: Би өглөө хамгийн сайн төвлөрдөг”`);
}

function fallback() {

  columns: ['id', 'conversation_id', 'role', 'content', 'actions', 'source', 'created_at'],
  mapping: aiMessagesMap,
  normalize: (r) => ({
    ...r,
    content: r.content || '',
    actions: Array.isArray(r.actions) ? r.actions : [],
    source: r.source || (r.role === 'user' ? 'user' : 'local-rules'),

const memories = createService({
  key: 'memories',
  tableName: TABLES.aiMemories,
  columns: ['id', 'content', 'source', 'created_at'],

});

    })),

  messages,

  sortedConversations() {

    messages.all().forEach((m) => {
      if (!last[m.conversation_id] || m.created_at > last[m.conversation_id]) last[m.conversation_id] = m.created_at;
    });
    return [...conversations.all()].sort((a, b) => String(last[b.id] || b.created_at).localeCompare(String(last[a.id] || a.created_at)));

  updateAction(messageId, index, patch) {
    const message = messages.get(messageId);
    const actions = message.actions.map((a, i) => (i === index ? { ...a, ...patch } : a));
    return messages.update(messageId, { actions });
  },

  async deleteConversation(id) {

      ref: { kind: 'event', id: e.id }, order: 2, date: e.event_date,
    });
  });

  birthdaysService.all().forEach((b) => {
    const days = daysUntil(b);
    const show = days === 0 || (b.reminder_enabled && days <= b.reminder_days);
    if (!show) return;
    const next = nextOccurrence(b);
    const age = ageAt(b, next);
    list.push({
      id: `birthday-${b.id}-${next}`, group: days === 0 ? 'attention' : 'upcoming', tone: 'accent', icon: 'gift',
      title: days === 0 ? `Өнөөдөр төрсөн өдөр: ${b.name}` : `${days} хоногийн дараа төрсөн өдөр: ${b.name}`,
      text: `${relDay(next)}${age ? ` · ${age} нас хүрнэ` : ''}`,
      ref: { kind: 'birthday', id: b.id }, order: 3, date: next,
    });
  });

  goalsService.all().filter((g) => g.status !== 'completed' && g.target_date).forEach((g) => {
    const days = diffDays(today, g.target_date);
    if (days > 7) return;
    list.push({
      id: `goal-${g.id}-${g.target_date}`, group: days < 0 ? 'attention' : 'upcoming', tone: days < 0 ? 'danger' : 'warning', icon: 'goals',
      title: `Зорилго: ${g.title}`, text: days < 0 ? `Зорилтот огноо ${-days} хоногийн өмнө өнгөрсөн` : `Зорилтот огноо: ${relDay(g.target_date)}`,
      ref: { kind: 'goal', id: g.id }, order: 4, date: g.target_date,
    });
  });

  projectsService.all().filter((p) => p.status !== 'completed' && p.due_date).forEach((p) => {
    const days = diffDays(today, p.due_date);
    if (days > 3) return;
    list.push({
      id: `project-${p.id}-${p.due_date}`, group: days < 0 ? 'attention' : 'upcoming', tone: days < 0 ? 'danger' : 'warning', icon: 'folder',
      title: `Төсөл: ${p.title}`, text: days < 0 ? `Дуусах огноо ${-days} хоногийн өмнө өнгөрсөн` : `Дуусах огноо: ${relDay(p.due_date)}`,
      ref: { kind: 'project', id: p.id, goalId: p.goal_id }, order: 5, date: p.due_date,
    });
  });

  return list
    .filter((n) => !dismissedIds.has(n.id))
    .map((n) => ({ ...n, read: readIds.has(n.id) }))
    .sort((a, b) => a.order - b.order || String(a.date).localeCompare(String(b.date)));
}

const notificationsService = {
  list: compute,
  unreadCount: () => compute().filter((n) => !n.read).length,
  markRead(id) { readIds.add(id); touch(); },
  markUnread(id) { readIds.delete(id); touch(); },
  markAllRead() { compute().forEach((n) => readIds.add(n.id)); touch(); },
  dismiss(id) { dismissedIds.add(id); touch(); },
  browserSupported: () => 'Notification' in window,
  browserPermission: () => ('Notification' in window ? Notification.permission : 'unsupported'),
  async requestBrowserPermission() {
    if (!('Notification' in window)) return 'unsupported';
    const result = await Notification.requestPermission();
    touch();
    return result;
  },
  showBrowserNotification(title, body) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return false;
    try { new Notification(title, { body, tag: `${title}-${body}` }); return true; } catch { return false; }
  },
};

/** Runs every minute: system alerts for things starting soon + re-render after midnight. */
function startNotificationTicker() {
  const alerted = new Set();
  let day = todayKey();
  const tick = () => {
    const today = todayKey();
    if (today !== day) { day = today; touch(); }
    if (notificationsService.browserPermission() !== 'granted') return;
    const now = nowMinutes();
    eventsService.on(today).forEach((e) => {
      if (e.all_day || !e.start_time) return;
      const inMin = timeToMin(e.start_time) - now;
      const key = `e-${e.id}-${today}`;
      if (inMin >= 0 && inMin <= 10 && !alerted.has(key)) {
        alerted.add(key);
        notificationsService.showBrowserNotification(e.title, `${fmtTime(e.start_time)}-д эхэлнэ${e.location ? ` · ${e.location}` : ''}`);
      }
    });
    tasksService.dueOn(today).forEach((t) => {
      if (t.status === 'done' || !t.due_time) return;
      const inMin = timeToMin(t.due_time) - now;
      const key = `t-${t.id}-${today}`;
      if (inMin >= 0 && inMin <= 10 && !alerted.has(key)) {
        alerted.add(key);
        notificationsService.showBrowserNotification(t.title, `${fmtTime(t.due_time)} гэхэд дуусах`);
      }
    });
  };
  tick();
  setInterval(tick, 60 * 1000);
}

          <label class="switch-row" for="${id.rem}"><span class="switch"><input id="${id.rem}" type="checkbox" name="reminder_enabled" ${b.reminder_enabled ? 'checked' : ''}><span></span></span><span class="muted small">Сануулах</span></label></div>

      const month = Number(data.birth_month);

        reminder_enabled: Boolean(data.reminder_enabled),
        reminder_days: data.reminder_days !== undefined ? Number(data.reminder_days) : (person?.reminder_days ?? 1),

  });

/**
 * Hash-based navigation helpers. Kept separate from router.js so pages can
 * import them without creating a circular import.
 *
 * Routes look like  #/tasks   #/goals/<id>   #/calendar?view=week&date=2026-11-02
 */
function navigate(path, { replace = false } = {}) {
  const hash = `#/${String(path).replace(/^#?\/?/, '')}`;
  if (replace) {
    history.replaceState(null, '', hash);
    window.dispatchEvent(new Event('lifeos:route'));
  } else if (location.hash === hash) {
    window.dispatchEvent(new Event('lifeos:route'));
  } else {
    location.hash = hash;
  }
}

function parseRoute(hash = location.hash) {
  const clean = hash.replace(/^#\/?/, '');
  const [path, qs = ''] = clean.split('?');
  const parts = path.split('/').filter(Boolean).map(decodeURIComponent);
  return {
    name: parts[0] || 'dashboard',
    params: parts.slice(1),
    query: Object.fromEntries(new URLSearchParams(qs)),
    key: hash || '#/dashboard',
  };
}

/** Ask the router to re-render the current page (e.g. after local UI state changed). */
const rerender = () => window.dispatchEvent(new Event('lifeos:route'));

});

/** Wires a search input to a results container (keyboard friendly). */
function bindSearch(input, results, { floating = true, onPick } = {}) {
  let flat = [];
  let active = -1;

  const highlight = () => {
    results.querySelectorAll('.sr-item').forEach((el, i) => {
      el.classList.toggle('is-active', i === active);
      el.setAttribute('aria-selected', String(i === active));
      if (i === active) el.scrollIntoView({ block: 'nearest' });
    });
  };

  const draw = () => {
    const value = input.value.trim();
    if (!value) {
      results.innerHTML = floating ? '' : '<p class="sr-empty">Ажил, үйл явдал, зорилго, төсөл, тэмдэглэл, төрсөн өдрөөс хайна.</p>';
      results.hidden = floating;
      flat = [];
      return;
    }
    const groups = searchEverything(value);
    flat = groups.flatMap((g) => g.items);
    active = flat.length ? 0 : -1;
    let i = -1;
    results.innerHTML = groups.length
      ? groups.map((g) => `<div class="sr-group" role="group" aria-label="${esc(g.label)}"><p class="sr-label">${esc(g.label)}</p>${g.items.map((it) => {
        i += 1;
        return `<button type="button" class="sr-item ${i === active ? 'is-active' : ''}" data-i="${i}" role="option" aria-selected="${i === active}">${icon(it.icon, 16)}<span class="sr-text"><span class="sr-title">${esc(it.title)}</span>${it.sub ? `<span class="sr-sub">${esc(it.sub)}</span>` : ''}</span></button>`;
      }).join('')}</div>`).join('')
      : `<p class="sr-empty">“${esc(value)}” гэсэн илэрц олдсонгүй.</p>`;
    results.hidden = false;
  };

  const pick = (i) => {
    const item = flat[i];
    if (!item) return;
    input.value = '';
    draw();
    input.blur();
    onPick?.();
    item.open();
  };

  input.addEventListener('input', draw);
  input.addEventListener('focus', () => { if (input.value.trim()) draw(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!flat.length) return;
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + flat.length) % flat.length;
      highlight();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      pick(active);
    } else if (e.key === 'Escape' && floating) {
      input.value = '';
      draw();
      input.blur();
    }
  });
  results.addEventListener('mousedown', (e) => e.preventDefault()); // keep focus while clicking
  results.addEventListener('click', (e) => {
    const b = e.target.closest('[data-i]');
    if (b) pick(Number(b.dataset.i));
  });
  if (floating) input.addEventListener('blur', () => setTimeout(() => { results.hidden = true; }, 120));
  draw();
}

function openSearchSheet() {

    title: 'Хайх',
    body: `<div class="search-sheet">
        <div class="search-field">${icon('search', 16)}<input id="searchSheetInput" type="search" class="input" placeholder="Бүгдээс хайх…" autocomplete="off" aria-label="Бүгдээс хайх" autofocus></div>

 */
const { tasksService, PRIORITY_LABEL } = __req("js/services/tasksService.js");
const { projectsService } = __req("js/services/goalsService.js");
const { openTaskForm, deleteWithUndo } = __req("js/components/forms.js");
const { toast } = __req("js/lib/ui.js");

const { icon } = __req("js/lib/icons.js");
const { todayKey, relDay, fmtTime, fmtDuration } = __req("js/lib/dates.js");

function taskItemHTML(t, { showDate = true, showProject = true } = {}) {
  const done = t.status === 'done';
  const overdue = !done && t.due_date && t.due_date < todayKey();
  const meta = [];
  if (t.priority !== 'low' && !done) meta.push(`<span class="meta-item is-${t.priority}">${icon('flag', 13)}${PRIORITY_LABEL[t.priority]}</span>`);
  if (showDate && t.due_date) meta.push(`<span class="meta-item ${overdue ? 'is-danger' : ''}">${icon('calendar', 13)}${esc(relDay(t.due_date))}${t.due_time ? ` · ${fmtTime(t.due_time)}` : ''}</span>`);
  else if (t.due_time) meta.push(`<span class="meta-item">${icon('clock', 13)}${fmtTime(t.due_time)}</span>`);
  if (t.estimated_minutes) meta.push(`<span class="meta-item">${icon('clock', 13)}${fmtDuration(t.estimated_minutes)}</span>`);
  if (t.category) meta.push(`<span class="meta-item tag">${esc(t.category)}</span>`);
  if (showProject && t.project_id) {
    const project = projectsService.get(t.project_id);
    if (project) meta.push(`<span class="meta-item">${icon('folder', 13)}${esc(project.title)}</span>`);
  }
  return `<li class="task prio-${t.priority} ${done ? 'is-done' : ''}" data-task-id="${t.id}">
    <button type="button" class="task-check" data-action="task-toggle" aria-pressed="${done}" aria-label="${done ? 'Дуусаагүй болгох' : 'Дуусгах'}: ${esc(t.title)}">${icon('check', 13)}</button>
    <button type="button" class="task-main" data-action="task-edit" aria-label="Засах: ${esc(t.title)}">
      <span class="task-title">${esc(t.title)}</span>
      ${meta.length ? `<span class="task-meta">${meta.join('')}</span>` : ''}
    </button>
    <button type="button" class="icon-btn icon-btn-sm task-del" data-action="task-delete" aria-label="Устгах: ${esc(t.title)}">${icon('trash', 15)}</button>
  </li>`;
}

function taskListHTML(tasks, opts) {
  return `<ul class="task-list">${tasks.map((t) => taskItemHTML(t, opts)).join('')}</ul>`;
}

async function toggleTask(task, row) {
  row?.classList.toggle('is-done', task.status !== 'done');
  try {
    const updated = await tasksService.toggle(task.id);
    if (updated.status === 'done') toast(`“${updated.title}” дууслаа`, { action: () => tasksService.toggle(task.id) });
  } catch (err) {
    row?.classList.toggle('is-done');
    toast(err.message, { tone: 'danger' });
  }
}

function handleTaskAction(event) {
  const button = event.target.closest('[data-action^="task-"]');
  if (!button) return false;
  const row = button.closest('[data-task-id]');
  const task = row && tasksService.get(row.dataset.taskId);
  if (!task) return false;
  switch (button.dataset.action) {
    case 'task-toggle': toggleTask(task, row); break;
    case 'task-edit': openTaskForm(task); break;
    case 'task-delete': deleteWithUndo(tasksService, task, task.title).catch((err) => toast(err.message, { tone: 'danger' })); break;
    default: return false;
  }
  return true;

      if (col === -1) { col = columns.length; columns.push(ev.e); } else columns[col] = ev.e;

  };

    cluster.push(ev);
    clusterEnd = Math.max(clusterEnd, ev.e);
  });

}

          project.status === 'completed'
            ? { label: 'Идэвхжүүлэх', icon: 'refresh', onSelect: () => projectsService.update(project.id, { status: 'active' }) }
            : { label: 'Дууссан болгох', icon: 'check', onSelect: () => projectsService.update(project.id, { status: 'completed' }).then(() => toast('Төсөл дууслаа')) },
          'sep',
          {
            label: 'Төсөл устгах', icon: 'trash', tone: 'danger',
            onSelect: async () => {
              const n = tasksService.byProject(project.id).length;
              const ok = await confirmDialog({ title: 'Энэ төслийг устгах уу?', message: `“${project.title}” устгагдана.${n ? ` Түүний ${n} ажил төсөлгүйгээр хадгалагдана.` : ''}` });
              if (!ok) return;
              try { await deleteProject(project.id); toast('Төсөл устгагдлаа'); } catch (err) { toast(err.message, { tone: 'danger' }); }
            },
          },
        ]);
        break;
      default:
    }
  };

  root.onsubmit = async (e) => {
    const form = e.target.closest('[data-add-to]');
    if (!form) return;
    e.preventDefault();
    const input = form.querySelector('input');
    const p = parseTaskInput(input.value);
    if (!p.title) { input.focus(); return; }
    try {

        title: p.title, project_id: form.dataset.addTo, due_date: p.due_date, due_time: p.due_time,
        priority: p.priority || prefs.get().defaultPriority, category: p.category || '',
        estimated_minutes: p.estimated_minutes || Number(prefs.get().defaultDuration) || null,
      });
      input.value = '';
      toast(`“${p.title}” нэмэгдлээ`);
    } catch (err) { toast(err.message, { tone: 'danger' }); }
  };
  root.onchange = null;
}

};

/* ───────────── actions ───────────── */
async function send(text) {
  const value = text.trim();
  if (!value || pending) return;
  composer = '';
  pending = true;
  rerender();
  try {
    let id = activeId;
    if (!id || !aiService.conversations.get(id)) {
      const convo = await aiService.startConversation(value);
      id = convo.id;
      activeId = id;
      navigate(`assistant/${id}`, { replace: true });
    }
    await aiService.send(id, value);
  } catch (err) {
    toast(err.message, { tone: 'danger' });
    composer = value;
  } finally {
    pending = false;
    rerender();
  }
}

async function apply(messageId, index) {
  const message = aiService.messages.get(messageId);
  const a = message?.actions[index];
  if (!a || a.status !== 'pending') return;
  try {
    switch (a.type) {
      case 'create_task': {
        const t = await tasksService.create({ ...a.data });
        await aiService.updateAction(messageId, index, { status: 'applied', result_id: t.id });
        toast('Ажил нэмэгдлээ');
        break;
      }
      case 'create_event': {
        const ev = await eventsService.create({ ...a.data });
        await aiService.updateAction(messageId, index, { status: 'applied', result_id: ev.id });
        toast('Үйл явдал нэмэгдлээ');
        break;
      }
      case 'create_memory': {
        await aiService.memories.create({ content: a.data.content, source: 'assistant' });
        await aiService.updateAction(messageId, index, { status: 'applied' });
        toast('Санамж хадгалагдлаа');
        break;
      }
      case 'schedule_day': {
        const blocks = a.data.blocks.filter((b) => b.kind === 'task');
        for (const b of blocks) {
          await eventsService.create({
            title: `Төвлөрөл: ${b.title}`, event_date: a.data.date, start_time: b.start, end_time: b.end,
            all_day: false, category: 'focus', description: 'Туслахын хуваариас үүсгэсэн төвлөрлийн блок.',
          });
        }
        await aiService.updateAction(messageId, index, { status: 'applied', result_count: blocks.length });
        toast(`${blocks.length} блок нэмэгдлээ`);
        break;
      }
      case 'schedule_week': {
        let n = 0;
        for (const s of a.data.suggestions) {
          const t = tasksService.get(s.task_id);
          if (t && !t.due_date && t.status !== 'done') { await tasksService.update(t.id, { due_date: s.date }); n += 1; }
        }
        await aiService.updateAction(messageId, index, { status: 'applied', result_count: n });
        toast(`${n} ажилд огноо тохирууллаа`);
        break;
      }
      case 'breakdown': {
        const draft = drafts.get(`${messageId}:${index}`) || { steps: a.data.steps, target: 'new' };
        const steps = draft.steps.map((s) => s.trim()).filter(Boolean);
        if (!steps.length) { toast('Эхлээд дор хаяж нэг алхам нэмнэ үү.', { tone: 'danger' }); return; }
        let projectId = draft.target;
        if (projectId === 'new' || !projectsService.get(projectId)) {
          projectId = (await projectsService.create({ title: a.data.title, status: 'active' })).id;
        }
        for (const s of steps) await tasksService.create({ title: s, project_id: projectId });
        await aiService.updateAction(messageId, index, { status: 'applied', result_count: steps.length, result_project_id: projectId });
        drafts.delete(`${messageId}:${index}`);
        toast(`${steps.length} ажил үүслээ`);
        break;
      }
      default:
    }
  } catch (err) {
    toast(err.hint ? `${err.message} — ${err.hint}` : err.message, { tone: 'danger' });
  }
}

function editFirst(messageId, index) {
  const a = aiService.messages.get(messageId).actions[index];
  const onSaved = (item) => aiService.updateAction(messageId, index, { status: 'applied', result_id: item.id });
  if (a.type === 'create_task') openTaskForm(null, a.data, { onSaved });
  if (a.type === 'create_event') openEventForm(null, a.data, { onSaved });
}

function bindMemoryForm(container, refresh) {
  container.addEventListener('submit', async (e) => {
    const form = e.target.closest('[data-mem-form]');
    if (!form) return;
    e.preventDefault();
    const input = form.querySelector('input');
    const content = input.value.trim();
    if (!content) { input.focus(); return; }
    try {
      await aiService.memories.create({ content, source: 'user' });
      input.value = '';
      toast('Санамж хадгалагдлаа');
      refresh?.();
    } catch (err) { toast(err.message, { tone: 'danger' }); }
  });
  container.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-action="mem-delete"]');
    if (!b) return;
    try { await aiService.memories.remove(b.dataset.id); toast('Санамж устгагдлаа'); refresh?.(); } catch (err) { toast(err.message, { tone: 'danger' }); }
  });
}

          ${connected ? '' : `<div class="ai-notice">${icon('info', 16)}<p><strong>AI загвар холбогдоогүй байна.</strong> Хариултууд таны өгөгдлийг уншдаг цөөн тооны энгийн дүрмээс гарна — чөлөөт яриа биш, тодорхой командуудыг ойлгоно. Жинхэнэ загвар холбохын тулд <code>js/config.js</code>-д <code>AI_ENDPOINT</code>-ийг тохируулна уу.</p></div>`}

            ${messages.length ? messages.map(messageHTML).join('') : welcomeHTML()}
            ${pending ? `<div class="msg msg-assistant"><div class="msg-avatar" aria-hidden="true">${icon('assistant', 16)}</div><div class="msg-content"><div class="msg-bubble typing" aria-label="Боловсруулж байна"><span></span><span></span><span></span></div></div></div>` : ''}
          </div>
          <div class="ai-footer">
          ${messages.length ? `<div class="ai-suggest" aria-label="Санал">${SUGGESTIONS.map((s) => `<button type="button" class="chip-btn" data-action="suggest" data-prompt="${esc(s.prompt)}">${icon(s.icon, 14)}${esc(s.label)}</button>`).join('')}</div>` : ''}
          <form class="ai-composer" id="aiComposer" autocomplete="off">
            <textarea id="aiInput" rows="1" maxlength="2000" placeholder="Ажил, үйл явдал бичих эсвэл төлөвлөгөө асуух…" aria-label="Мессеж">${esc(composer)}</textarea>

          </div>
        </section>

        <aside class="card ai-memories" aria-label="Санамж">${memoriesPanel()}</aside>
      </div>`;

    const list = root.querySelector('#aiMessages');
    list.scrollTop = list.scrollHeight;
    // On phones the whole page scrolls (composer is sticky), so follow new messages there too.
    const count = messages.length + (pending ? 1 : 0);
    if (count !== lastCount && window.matchMedia('(max-width: 760px)').matches) {
      requestAnimationFrame(() => window.scrollTo(0, document.documentElement.scrollHeight));
    }
    lastCount = count;
    const input = root.querySelector('#aiInput');
    const autosize = () => { input.style.height = 'auto'; input.style.height = `${Math.min(input.scrollHeight, 160)}px`; };
    autosize();

    bindMemoryForm(root.querySelector('.ai-memories'));

    root.oninput = (e) => {
      if (e.target.id === 'aiInput') { composer = e.target.value; autosize(); }
      if (e.target.dataset.step !== undefined && e.target.dataset.msg) {
        const draft = drafts.get(`${e.target.dataset.msg}:${e.target.dataset.i}`);
        if (draft) draft.steps[Number(e.target.dataset.step)] = e.target.value;
      }
    };
    root.onchange = (e) => {
      if (e.target.id === 'convoSelect') {
        activeId = e.target.value || null;
        navigate(activeId ? `assistant/${activeId}` : 'assistant', { replace: true });
      }
      if (e.target.dataset.target !== undefined) {
        const draft = drafts.get(`${e.target.dataset.msg}:${e.target.dataset.i}`);
        if (draft) draft.target = e.target.value;
      }
    };
    root.onkeydown = (e) => {
      if (e.target.id === 'aiInput' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        send(e.target.value);
      }
    };
    root.onsubmit = (e) => {
      if (e.target.id !== 'aiComposer') return;
      e.preventDefault();
      send(input.value);
    };
    root.onclick = async (e) => {
      if (handleTaskAction(e)) return;
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const { msg, i } = el.dataset;
      const index = Number(i);
      switch (el.dataset.action) {
        case 'new-chat': activeId = null; composer = ''; navigate('assistant', { replace: true }); setTimeout(() => document.getElementById('aiInput')?.focus()); break;
        case 'open-chat': activeId = el.dataset.id; navigate(`assistant/${activeId}`, { replace: true }); break;
        case 'delete-chat': {
          const c = aiService.conversations.get(el.dataset.id);
          if (!(await confirmDialog({ title: 'Яриаг устгах уу?', message: `“${c.title}” болон түүний мессежүүд устна. Нэмсэн ажил, үйл явдал хэвээр үлдэнэ.` }))) return;
          try {
            await aiService.deleteConversation(c.id);
            if (activeId === c.id) { activeId = null; navigate('assistant', { replace: true }); }
            toast('Яриа устгагдлаа');
          } catch (err) { toast(err.message, { tone: 'danger' }); }
          break;
        }
        case 'suggest': send(el.dataset.prompt); break;
        case 'open-memories':
          openModal({
            title: 'Санамж',
            body: `<div id="memModalBody">${memoriesPanel()}</div>`,
            onMount(modal) {
              const body = modal.querySelector('#memModalBody');
              bindMemoryForm(body, () => { body.innerHTML = memoriesPanel(); body.querySelector('input')?.focus(); });
            },
          });
          break;
        case 'ac-apply': apply(msg, index); break;
        case 'ac-edit': editFirst(msg, index); break;
        case 'ac-dismiss': aiService.updateAction(msg, index, { status: 'dismissed' }).catch((err) => toast(err.message, { tone: 'danger' })); break;
        case 'ac-open-task': {
          const t = tasksService.get(aiService.messages.get(msg).actions[index].result_id);
          if (t) openTaskForm(t);
          break;
        }
        case 'ac-step-add': {
          const draft = drafts.get(`${msg}:${i}`);
          draft.steps.push('');
          rerender();
          setTimeout(() => document.getElementById(`step-${msg}-${i}-${draft.steps.length - 1}`)?.focus());
          break;
        }
        case 'ac-step-remove': {
          const draft = drafts.get(`${msg}:${i}`);
          draft.steps.splice(Number(el.dataset.step), 1);
          rerender();
          break;
        }
        case 'ac-move-overdue': {
          const ids = el.dataset.ids.split(',');
          try {
            for (const id of ids) if (tasksService.get(id)) await tasksService.update(id, { due_date: todayKey() });
            toast(`${ids.length} ажлыг өнөөдөр рүү шилжүүллээ`);
          } catch (err) { toast(err.message, { tone: 'danger' }); }
          break;
        }
        default:
      }
    };
  },
};

});

    const text = target.dataset.tip;
    if (!text) return;
    tip.textContent = text;
    tip.hidden = false;
    const w = tip.offsetWidth;
    const h = tip.offsetHeight;
    tip.style.left = `${Math.max(8, Math.min(x - w / 2, window.innerWidth - w - 8))}px`;
    tip.style.top = `${Math.max(8, y - h - 12)}px`;

    if (!target) return;
    const r = target.getBoundingClientRect();
    show(target, r.left + r.width / 2, r.top);
  });

  window.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true, once: true });
}

            if (totalRows() && !(await confirmDialog({ title: 'Жишээ өгөгдөл нэмэх үү?', message: 'Жишээ бичлэгүүд энэ сешн дэх өгөгдлийн хажууд нэмэгдэнэ.', confirmLabel: 'Нэмэх', tone: 'primary' }))) return;

          case 'clear-session':
            if (!(await confirmDialog({ title: 'Сешний өгөгдлийг цэвэрлэх үү?', message: 'Энэ цонхны бүх өгөгдөл устна. Буцаах боломжгүй.', confirmLabel: 'Бүгдийг цэвэрлэх' }))) return;

            break;
          case 'sign-out':
            await authService.signOut(); // page reloads via the auth listener
            break;
          case 'enable-notifications': {
            const result = await notificationsService.requestBrowserPermission();
            toast(result === 'granted' ? 'Хөтчийн сануулга асаалаа' : 'Хөтчийн сануулгыг зөвшөөрсөнгүй', { tone: result === 'granted' ? 'default' : 'danger' });
            render(root);
            break;
          }
          case 'test-notification':
            if (!notificationsService.showBrowserNotification('Life OS туршилт', 'Мэдэгдэл ажиллаж байна.')) toast('Хөтөч мэдэгдлийг харуулсангүй.', { tone: 'danger' });
            break;
          case 'reset-prefs':
            prefs.reset();
            toast('Тохиргоо сэргээгдлээ');
            break;
          default:
        }
      } catch (err) {
        toast(err.message, { tone: 'danger' });
      }
    };
  },
